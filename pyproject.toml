[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "predator"
version = "0.1.0"
description = "Field-bus scanner that inventories BACnet, Modbus, MQTT, PROFINET, PROFIBUS, Siemens P1 and more into CSV"
requires-python = ">=3.9"
dependencies = ["pyserial>=3.5", "paho-mqtt>=2.0"]

[project.scripts]
predator = "predator.cli:main"

[tool.setuptools.packages.find]
include = ["predator*"]
